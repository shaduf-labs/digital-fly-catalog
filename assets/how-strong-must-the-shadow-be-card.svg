<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">How strong must the shadow be? In our brain-only test the turn command appeared from about 30 spikes per second per looming neuron on both eyes. Digital Fly Lab, 8 Oct 2026</title><desc id="d">We lowered the input to the looming neurons step by step, from 80 to 10 spikes per second each. The turn command appeared from about 30 per second (38% of our strongest input) on both sides; below that the model did not turn. The escape neuron started firing at the same input as the turn command. One model (Shiu et al. LIF on FlyWire v783), brain only; the input is a rate we set for every LC4/LPLC2 of one eye, not a measured response to a real shadow; 'silenced' means the neuron's output synapses were removed; not a real fly. We found no measured real-fly LC4/LPLC2 firing rate during looming to compare these rates with (abstract search, 8 Oct 2026).</desc><style>text{font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;fill:#131313}.k{font-size:17px;font-weight:700;letter-spacing:.08em;fill:#2f6b4f}.h{font-size:44px;font-weight:800}.s{font-size:24px}.n{font-size:72px;font-weight:800}.l{font-size:19px;font-weight:650}.m{font-size:16px;fill:#595953}.c{font-size:15.5px;fill:#3d3d39}.b{font-size:20px;font-weight:700;fill:#2f6b4f}.u{font-size:15px;fill:#6f6e69}.dot{fill:#131313;stroke:#fff;stroke-width:1.5}.open{fill:#fff;stroke:#131313;stroke-width:2}.line{fill:none;stroke:#131313;stroke-width:1.6}.liner{fill:none;stroke:#131313;stroke-width:1.6;stroke-dasharray:5 4}.zone{fill:#f3f2ee}.thr{stroke:#2f6b4f;stroke-width:2;stroke-dasharray:5 4}.panel{fill:#f7f7f5}.grid{stroke:#e6e5e1;stroke-width:1}.rule{stroke:#d2d1ca;stroke-width:1.5}.bar{fill:#2f6b4f}</style><rect x="0" y="0" width="1200" height="675" fill="#fff"></rect><rect x="0" y="0" width="14" height="675" class="bar"></rect><text x="64" y="62" text-anchor="start" class="k">DIGITAL FLY LAB · OUR OWN TEST · 8 OCT 2026 · BRAIN ONLY</text><text x="64" y="120" text-anchor="start" class="h">How strong must the shadow be?</text><text x="64" y="168" text-anchor="start" class="s">We lowered the input to the looming neurons step</text><text x="64" y="200" text-anchor="start" class="s">by step, from 80 to 10 spikes per second each. The</text><text x="64" y="232" text-anchor="start" class="s">turn command appeared from about 30 per second</text><text x="64" y="264" text-anchor="start" class="s">(38% of our strongest input) on both sides; below</text><text x="64" y="296" text-anchor="start" class="s">that the model did not turn.</text><text x="64" y="392" text-anchor="start" class="n">30 per second</text><text x="64" y="424" text-anchor="start" class="l">per looming neuron, both eyes: 38% of our strongest input</text><rect x="760" y="150" width="390" height="300" rx="10" class="panel"></rect><rect x="810" y="190" width="91.18" height="200" class="zone"></rect><line x1="810" y1="390" x2="1120" y2="390" class="grid"></line><text x="800" y="395" text-anchor="end" class="u">0</text><line x1="810" y1="301.11" x2="1120" y2="301.11" class="grid"></line><text x="800" y="306.11" text-anchor="end" class="u">20</text><line x1="810" y1="212.22" x2="1120" y2="212.22" class="grid"></line><text x="800" y="217.22" text-anchor="end" class="u">40</text><line x1="919.41" y1="186" x2="919.41" y2="390" class="thr"></line><path d="M846.47 390 L882.94 385.56 L919.41 354.44 L955.88 301.11 L1028.82 301.11 L1101.76 278.89" class="line"></path><path d="M846.47 390 L882.94 390 L919.41 336.67 L955.88 283.33 L1028.82 216.67 L1101.76 207.78" class="liner"></path><circle cx="843.47" cy="390" r="7" class="open"></circle><circle cx="879.94" cy="385.56" r="7" class="open"></circle><circle cx="916.41" cy="354.44" r="7" class="dot"></circle><circle cx="952.88" cy="301.11" r="7" class="dot"></circle><circle cx="1025.82" cy="301.11" r="7" class="dot"></circle><circle cx="1098.76" cy="278.89" r="7" class="dot"></circle><rect x="842.97" y="383.5" width="13" height="13" rx="2" class="open"></rect><rect x="879.44" y="383.5" width="13" height="13" rx="2" class="open"></rect><rect x="915.91" y="330.17" width="13" height="13" rx="2" class="dot"></rect><rect x="952.38" y="276.83" width="13" height="13" rx="2" class="dot"></rect><rect x="1025.32" y="210.17" width="13" height="13" rx="2" class="dot"></rect><rect x="1098.26" y="201.28" width="13" height="13" rx="2" class="dot"></rect><text x="846.47" y="412" text-anchor="middle" class="u">10</text><text x="882.94" y="412" text-anchor="middle" class="u">20</text><text x="919.41" y="412" text-anchor="middle" class="u">30</text><text x="955.88" y="412" text-anchor="middle" class="u">40</text><text x="1028.82" y="412" text-anchor="middle" class="u">60</text><text x="1101.76" y="412" text-anchor="middle" class="u">80</text><text x="780" y="176" text-anchor="start" class="m">Turn command (Hz) vs input per neuron</text><text x="780" y="436" text-anchor="start" class="u">circle: left eye · square: right · open: no turn</text><line x1="64" y1="519" x2="1150" y2="519" class="rule"></line><text x="64" y="541" text-anchor="start" class="c">One model (Shiu et al. LIF on FlyWire v783), brain only; the input is a rate we set for every LC4/LPLC2 of one eye, not</text><text x="64" y="562" text-anchor="start" class="c">a measured response to a real shadow; 'silenced' means the neuron's output synapses were removed; not a real fly. We</text><text x="64" y="583" text-anchor="start" class="c">found no measured real-fly LC4/LPLC2 firing rate during looming to compare these rates with (abstract search, 8 Oct</text><text x="64" y="604" text-anchor="start" class="c">2026).</text><text x="64" y="652" text-anchor="start" class="b">Digital Fly Lab: fruit fly brain simulation catalogue</text><text x="1150" y="652" text-anchor="end" class="u">shaduf.ai/p/digital-fly-catalog/is-it-real/#loom3-heading</text></svg>
