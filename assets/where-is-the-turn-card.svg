<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Where in the wiring is the turn? Scrambled fly brain maps turned up to the real map's activity gave no turn command in 3 of 3 trials. Digital Fly Lab, 6 Oct 2026</title><desc id="d">We turned the scrambled maps up until they were as busy as the real one. They still did not produce the turn: the wiring, not the amount of activity, makes it. One model (Shiu et al. LIF on FlyWire v783), brain only, every LC4/LPLC2 of one eye at 80 Hz for 1 s; descending-neuron rates, not a moving fly; not a real fly. n: real map 6 trials, scrambled and turned up 3 matched trials over 3 shuffles. No body runs yet for the new trials; the direction rests on our mapping.</desc><style>text{font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;fill:#131313}.k{font-size:17px;font-weight:700;letter-spacing:.08em;fill:#2f6b4f}.h{font-size:34px;font-weight:800}.n{font-size:64px;font-weight:800}.ns{font-size:64px;font-weight:800;fill:#3f4f9c}.l{font-size:19px;font-weight:650}.m{font-size:16px;fill:#595953}.c{font-size:16px;fill:#3d3d39}.b{font-size:20px;font-weight:700;fill:#2f6b4f}.u{font-size:15px;fill:#6f6e69}.real{fill:#131313}.scr{fill:#5a6cc0}.band{fill:#eaf2ec}.panel{fill:#f7f7f5}.rule{stroke:#d2d1ca;stroke-width:1.5}.zero{stroke:#d2d1ca;stroke-width:1.2}.bar{fill:#2f6b4f}</style><rect x="0" y="0" width="1200" height="675" fill="#fff"></rect><rect x="0" y="0" width="14" height="675" class="bar"></rect><text x="64" y="64" text-anchor="start" class="k">DIGITAL FLY LAB · OUR OWN TEST · 6 OCT 2026 · BRAIN ONLY</text><text x="64" y="120" text-anchor="start" class="h">We turned the scrambled maps up until they were as</text><text x="64" y="166" text-anchor="start" class="h">busy as the real one. They still did not produce the</text><text x="64" y="212" text-anchor="start" class="h">turn: the wiring, not the amount of activity, makes it.</text><text x="64" y="330" text-anchor="start" class="n">6 of 6</text><text x="64" y="362" text-anchor="start" class="l">real-map trials: a turn command (23–44 Hz)</text><text x="64" y="450" text-anchor="start" class="ns">0 of 3</text><text x="64" y="482" text-anchor="start" class="l">scrambled maps as busy as the real one: 0 Hz</text><rect x="720" y="262" width="430" height="236" rx="10" class="panel"></rect><text x="744" y="290" text-anchor="start" class="m">How busy (× real)</text><text x="960" y="290" text-anchor="start" class="m">Turn command (Hz)</text><rect x="829" y="302" width="72.86" height="160" class="band"></rect><line x1="865.43" y1="302" x2="865.43" y2="462" class="zero"></line><line x1="960" y1="302" x2="960" y2="462" class="zero"></line><text x="744" y="326" text-anchor="start" class="u">Real map</text><circle cx="862.72" cy="340" r="6" class="real"></circle><circle cx="1033.6" cy="340" r="6" class="real"></circle><circle cx="864.76" cy="340" r="6" class="real"></circle><circle cx="1049.6" cy="340" r="6" class="real"></circle><circle cx="866.04" cy="344.8" r="6" class="real"></circle><circle cx="1100.8" cy="340" r="6" class="real"></circle><circle cx="864.87" cy="335.2" r="6" class="real"></circle><circle cx="1100.8" cy="344.8" r="6" class="real"></circle><circle cx="868.82" cy="340" r="6" class="real"></circle><circle cx="1040" cy="340" r="6" class="real"></circle><circle cx="865.38" cy="349.6" r="6" class="real"></circle><circle cx="1091.2" cy="340" r="6" class="real"></circle><text x="744" y="378" text-anchor="start" class="u">Scrambled</text><circle cx="752.69" cy="392" r="6" class="scr"></circle><circle cx="960" cy="392" r="6" class="scr"></circle><circle cx="752.25" cy="396.8" r="6" class="scr"></circle><circle cx="960" cy="396.8" r="6" class="scr"></circle><circle cx="751.86" cy="387.2" r="6" class="scr"></circle><circle cx="960" cy="387.2" r="6" class="scr"></circle><circle cx="752.57" cy="401.6" r="6" class="scr"></circle><circle cx="960" cy="401.6" r="6" class="scr"></circle><circle cx="752.88" cy="382.4" r="6" class="scr"></circle><circle cx="960" cy="382.4" r="6" class="scr"></circle><circle cx="752.86" cy="406.4" r="6" class="scr"></circle><circle cx="960" cy="406.4" r="6" class="scr"></circle><text x="744" y="430" text-anchor="start" class="u">Scrambled, turned up</text><circle cx="864.66" cy="444" r="6" class="scr"></circle><circle cx="960" cy="444" r="6" class="scr"></circle><circle cx="862.58" cy="444" r="6" class="scr"></circle><circle cx="960" cy="448.8" r="6" class="scr"></circle><circle cx="861.77" cy="448.8" r="6" class="scr"></circle><circle cx="960" cy="439.2" r="6" class="scr"></circle><text x="744" y="482" text-anchor="middle" class="u">0</text><text x="865.43" y="482" text-anchor="middle" class="u">1×</text><text x="960" y="482" text-anchor="middle" class="u">0</text><text x="1088" y="482" text-anchor="middle" class="u">40</text><line x1="64" y1="524" x2="1150" y2="524" class="rule"></line><text x="64" y="552" text-anchor="start" class="c">Brain only: one model (Shiu et al. LIF on FlyWire v783), every LC4/LPLC2 of one eye at 80 Hz for 1 s;</text><text x="64" y="574" text-anchor="start" class="c">descending-neuron rates, not a moving fly, not a real fly. n: real map 6, turned-up scrambles 3 (3 shuffles).</text><text x="64" y="596" text-anchor="start" class="c">Body runs pending; &quot;away&quot; rests on our mapping. Pre-registered 6 Oct 2026, 09:42:54 UTC. One dot per trial.</text><text x="64" y="646" text-anchor="start" class="b">Digital Fly Lab: fruit fly brain simulation catalogue</text><text x="1150" y="646" text-anchor="end" class="u">shaduf.ai/p/digital-fly-catalog/is-it-real/#loom2-heading</text></svg>
