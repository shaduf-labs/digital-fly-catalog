<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Search and filter fruit fly brain projects</title>
<style>
  :root {
    --ink: #37352f; --text: #4f4d47; --muted: #787774; --faint: #a8a6a1;
    --line: #e6e5e2; --line-strong: #d4d2cd; --soft: #f7f7f5; --blue: #326ca6; --blue-bg: #e7eef6;
    --green: #3e7d5c; --green-bg: #e7f1eb; --amber: #8a641f; --amber-bg: #f5edda; --red: #9f3f3b; --red-bg: #f8e7e5;
    --grade-a: #1d5a43; --grade-b: #3f8a66; --grade-c: #8fc0a4; --grade-d: #d3e6da;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { color: var(--ink); font: 14px/1.5 Inter, "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { padding: 16px 16px 18px; min-width: 0; }
  .search { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
  label, .group-label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  input[type=search], select {
    width: 100%; min-width: 0; min-height: 2.5em; padding: .4em .6em; border: 1px solid var(--line-strong); border-radius: 5px;
    background: #fff; color: var(--ink); font: inherit; font-size: 14px;
  }
  input[type=search]:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, input[type=checkbox]:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  .grades { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
  .grades .group-label { margin-right: 4px; }
  .gbtn {
    min-width: 2.6em; min-height: 2.2em; padding: 0 .6em; border: 1.5px solid var(--line-strong); border-radius: 5px;
    background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .gbtn[aria-pressed="true"].g-a { background: var(--grade-a); border-color: var(--grade-a); color: #fff; }
  .gbtn[aria-pressed="true"].g-b { background: var(--grade-b); border-color: var(--grade-b); color: #fff; }
  .gbtn[aria-pressed="true"].g-c { background: var(--grade-c); border-color: var(--grade-c); }
  .gbtn[aria-pressed="true"].g-d { background: var(--grade-d); border-color: #b9d2c3; }
  .gbtn[aria-pressed="true"].g-u { background: #fff; border-style: dashed; border-color: var(--ink); }
  .gbtn[aria-pressed="true"].g-na { background: var(--line); border-color: var(--muted); }
  .gbtn:hover { border-color: var(--ink); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 0 0 12px; }
  .filters > div { display: flex; flex-direction: column; gap: 4px; flex: 1 1 10em; min-width: 0; }
  .toggles { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13.5px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; }
  .check input { width: 1.1em; height: 1.1em; margin: 0; }
  .sort { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sort select { width: auto; max-width: 100%; }
  .status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin: 0 0 8px; }
  .count { margin: 0; color: var(--text); font-size: 13px; }
  .count strong { color: var(--ink); }
  .reset { padding: .35em .8em; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--soft); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  .reset:hover { border-color: var(--ink); }
  ol.results { margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
  .row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row > * { min-width: 0; }
  .grade { display: inline-flex; align-items: center; justify-content: center; width: 2.4em; height: 2.4em; border-radius: 5px; font-size: 13px; font-weight: 700; line-height: 1; }
  .grade.g-a { background: var(--grade-a); color: #fff; }
  .grade.g-b { background: var(--grade-b); color: #fff; }
  .grade.g-c { background: var(--grade-c); color: var(--ink); }
  .grade.g-d { background: var(--grade-d); color: var(--ink); }
  .grade.g-u { background: #fff; color: var(--text); border: 1.5px dashed var(--muted); }
  .grade.g-na { background: var(--line); color: var(--text); font-size: 11px; }
  .row h3 { margin: 0; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-weight: 500; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .by { margin: 2px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .summary { margin: 6px 0 0; color: var(--text); font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--text); }
  .facts li { min-width: 0; overflow-wrap: anywhere; }
  .facts span { color: var(--muted); }
  .pill { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .pill.warn { background: var(--amber-bg); color: var(--amber); }
  .pill.bad { background: var(--red-bg); color: var(--red); }
  .empty { padding: 18px 0; color: var(--text); }
  .empty[hidden] { display: none; }
  .foot { margin: 12px 0 0; color: var(--muted); font-size: 11.5px; }
  .rid { margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: var(--soft); color: var(--text); font: 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; user-select: all; }
  .gnote { margin: 6px 0 0; padding: 6px 9px; border-left: 3px solid var(--amber); background: var(--amber-bg); color: var(--ink); font-size: 12.5px; line-height: 1.5; }
  .mech { margin: 6px 0 0; color: var(--text); font-size: 12px; line-height: 1.5; }
  .flag { color: var(--red); font-weight: 700; }
  .urls { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .urls li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 2px 0; min-width: 0; }
  .ulabel { min-width: 3.6em; color: var(--muted); font-weight: 600; }
  .url { min-width: 0; color: var(--ink); font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; overflow-wrap: anywhere; user-select: all; }
  .unote { color: var(--muted); font-size: 11.5px; }
  .urls .none { color: var(--faint); }
  .rowref { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; }
  .more { display: block; width: 100%; margin: 12px 0 0; padding: .6em 1em; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--soft); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .more:hover { border-color: var(--ink); }
  .more[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
</style>
</head>
<body>
<div class="app" data-shaduf-resize-root>

  <div class="search">
    <label for="q">Search projects</label>
    <input id="q" type="search" placeholder="Name, ID, idea or author, e.g. Doom, walking, FlyGym" autocomplete="off">
  </div>

  <div class="grades" role="group" aria-labelledby="grade-label">
    <span class="group-label" id="grade-label">Evidence grade</span>
    <!-- grade buttons are built from the data -->
  </div>

  <div class="filters">
    <div><label for="f-type">Category</label><select id="f-type"><option value="">All categories</option></select></div>
    <div><label for="f-dataset">Dataset</label><select id="f-dataset"><option value="">All datasets</option></select></div>
    <div><label for="f-licence">Code licence</label><select id="f-licence"><option value="">All licences</option></select></div>
    <div><label for="f-platform">Runs on</label><select id="f-platform"><option value="">All platforms</option></select></div>
  </div>

  <div class="toggles">
    <label class="check" for="f-browser"><input id="f-browser" type="checkbox"> Try in browser, no install</label>
    <span class="sort"><label for="f-sort">Sort</label>
      <select id="f-sort">
        <option value="updated-desc">Last upstream update, newest first</option>
        <option value="updated-asc">Last upstream update, oldest first</option>
        <option value="grade">Evidence grade, A first</option>
        <option value="name">Name, A to Z</option>
      </select>
    </span>
  </div>

  <div class="status">
    <p class="count" id="count" aria-live="polite"></p>
    <button type="button" class="reset" id="reset">Reset filters</button>
  </div>

  <ol class="results" id="results" aria-label="Matching projects"></ol>
  <button type="button" class="more" id="more" hidden>Show all</button>
  <p class="empty" id="empty" hidden>No projects match these filters. Try fewer filters or a shorter search.</p>
  <p class="foot" id="foot"></p>
</div>

parate local Python/MuJoCo build can load the Winding et al. L1 larval connectome if the user prepares the data.","evidence_grade":"D","grade_note":null,"dataset":"larval L1","release":"Winding et al. 2023 Supplementary Data S1 (local build only, user-prepared; the browser demo loads none)","data_licence":"article CC BY 4.0; no separate data licence found","mechanism_short":"Model: none · In: none · Out: none · Trained: none · Scripted: yes · Body: custom","code_licence":"MIT","no_licence_file":false,"platform":["browser","Windows","macOS","Linux"],"gpu":"none","download_size":"not stated (browser page is small: three.js + ~180 KB GLB); the local build needs the Winding S1 archive, downloaded by the user","last_commit":"2026-09-15","last_release":null,"updated":"2026-09-15","last_verified":"2026-09-28","link_status":"ok (HTTP 200)","try_url":"https://chenyvhang.github.io/cyber-larva/","try_status":"page responds, not played by us","code_url":"https://github.com/ChenYvhang/cyber-larva","source_url":null,"tags":["A sparse neural simulation constrained by the Winding et al. L1 connectome receives environmental sensory signals ... drives an 11-segment MuJoCo neuromechanical body","control benchmark"]},{"id":"fly-brain-lulzx","name":"fly-brain","type":"browser-demo","author_or_org":"Lulzx","summary":"Runs the whole MaleCNS v1.0 connectome (165,122 neurons) as a spiking network for each fly in the browser, with a MuJoCo flybody body and a flyvis compound eye. Descending-neuron activity sets walking, turning, grooming and escape commands. Documented offline experiments score the model against literature targets and against shuffled-wiring controls.","evidence_grade":"A","grade_note":"Borderline A: the shuffled-wiring benchmark was also used to fit the model, and it has not been re-run after a later fix.","dataset":"MaleCNS","release":"v1.0","data_licence":"CC-BY-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: yes · Scripted: yes · Body: flybo "browser-demo","author_or_org":"hwkim3330","summary":"A browser tool that plays games with key presses, reads the screen, and records bugs so they can be replayed. One of its steering policies is a spiking model of the whole FlyWire v783 brain in a Web Worker. The author benchmarked it against random-steering baselines, and it does worse.","evidence_grade":"A","grade_note":"Borderline A: a negative result against no-graph and random baselines, but the correlation numbers are not produced by any committed script. A stricter reading gives B.","dataset":"FlyWire FAFB","release":"v783","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: learned · Trained: none · Scripted: none · Body: none","code_licence":"No licence file","no_licence_file":true,"platform":["browser"],"gpu":"none","download_size":"~13 MB (brain.bin 11.4 MB raw / ~7.45 MB gzip, meta.json 0.48 MB, pos.bin 0.97 MB), plus 4.6 MB doom.wasm for DOOM mode","last_commit":"2026-09-27","last_release":null,"updated":"2026-09-27","last_verified":"2026-09-28","link_status":"ok (HTTP 200)","try_url":"https://hwkim3330.github.io/flyworker/","try_status":"page responds, not played by us","code_url":"https://github.com/hwkim3330/flyworker","source_url":null,"tags":["A QA fuzzer for browser games. One of its policies is a real fruit-fly connectome — and that one loses.","control benchmark"]},{"id":"flybrain-app-snedea","name":"FlyBrain","type":"browser-demo","author_or_org":"snedea","summary":"A 2D browser pet fly you can feed, touch, blow air at, or expose to light and temperature. A Web Worker runs spikes over the full FlyWire brain graph, and a panel shows them. What the fly does on screen is chosen by a threshold state machine and hand-coded steering, with the network's group activity as one input.","evidence_grade":"C","grade_note":null,"dataset":"FlyWire FAFB","release":"v783","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none pikeCalls","summary":"A Python package and a browser demo. Camera optic flow drives chosen fly visual neuron types in a LIF network, and six descending-neuron groups are read out as throttle and yaw for a simulated or real drone. The browser demo runs 'MiniFly', an 850-neuron hand-wired stand-in; MaleCNS v1.0 is an optional path in the Python package.","evidence_grade":"C","grade_note":null,"dataset":"MaleCNS","release":"v1.0 (optional; default brain is synthetic MiniFly)","data_licence":"CC-BY-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: yes · Scripted: yes · Body: custom","code_licence":"MIT","no_licence_file":false,"platform":["browser","macOS","Windows","Linux"],"gpu":"none","download_size":"~1.2 GB MaleCNS data (optional; MiniFly needs none)","last_commit":"2026-09-16","last_release":null,"updated":"2026-09-16","last_verified":"2026-09-28","link_status":"ok (HTTP 200)","try_url":"https://spikecalls.github.io/FlyDrones/","try_status":"page responds, not played by us","code_url":"https://github.com/SpikeCalls/FlyDrones","source_url":null,"tags":["A fruit fly's wiring diagram is flying this drone."]},{"id":"help-the-fly-escape","name":"Help the Fly Escape","type":"browser-demo","author_or_org":"dzhng","summary":"A 3D browser puzzle game: you place household objects, then a swarm of flies tries to find the exit. Each fly runs its own noisy LIF simulation of a 70,000-neuron MaleCNS subgraph in Rust/WASM. Readouts from descending and motor neurons set each fly's walking thrust, turning and takeoff.","evidence_grade":"B","grade_note":null,"dataset":"MaleCNS","release":"v1.0","data_licence":"CC-BY-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none · Scripted: yes · Body: custom","code_licence":"No licence file","no_licence_file":true,"platform":["browser"],"gpu":"none","download_size":"~11 MB brain data (graph.bin 9.9 MB, manifest 0.6 MB, retinal map 0.2 MB) plus WASM and 3D assets; total not measured", male (MaleCNS v1.0) and a female (FlyWire v783) brain, spiking in a slowed-down LIF model after a 'puff'. The first descending-neuron spike triggers a puppet animation, but the code fixes the kind of reaction (lunge or pause) by sex.","evidence_grade":"C","grade_note":null,"dataset":"several","release":"MaleCNS v1.0; FlyWire FAFB v783","data_licence":"several (see dataset entries)","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none · Scripted: yes · Body: custom","code_licence":"No licence file","no_licence_file":true,"platform":["browser"],"gpu":"none","download_size":"~11 MB (data/real JSON ~10 MB plus 0.6 MB bundle)","last_commit":"2026-09-13","last_release":null,"updated":"2026-09-13","last_verified":"2026-09-28","link_status":"ok (HTTP 200)","try_url":"https://anzal1.github.io/samesmell/","try_status":"page responds, not played by us","code_url":"https://github.com/anzal1/samesmell","source_url":null,"tags":["Two real fruit fly brains. One pheromone. Opposite reactions."]},{"id":"vial","name":"Vial (fly-vial)","type":"browser-demo","author_or_org":"Raphael Rocha (RaphaelSR)","summary":"A virtual-pet game where you feed, clean and train a 3D fly. A web worker runs a LIF simulation of the whole FlyWire brain, pruned to connections of 5 or more synapses. Firing of chosen descending and motor neurons sets reflex animations, and a small REINFORCE policy learns 'tricks' from descending-neuron activity.","evidence_grade":"B","grade_note":null,"dataset":"FlyWire FAFB","release":"v783","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: yes · Scripted: yes · Body: custom","code_licence":"MIT","no_licence_file":false,"platform":["browser"],"gpu":"none","download_size":"~8 MB data (conn.bin.gz 6.8 MB, positions 0.8 MB, labels 0.4 MB)","last_commit":"2026-09-19","last_release":null,"updated":"2026-09-19","last_verified":"2026-09-28","link_status":"ok (HTTP 200)","try_url":"https://raphaelsr.git <script>
(() => {
  const raw = JSON.parse(document.getElementById('catalogue-data').textContent)
  const GRADES = ['A', 'B', 'C', 'D', 'U', 'n/a']
  const GRADE_LABEL = {A: 'A: tested against data or a control', B: 'B: connectome runs, hand-made inputs and outputs', C: 'C: partial, stand-in or decorative network', D: 'D: scripted or game logic', U: 'U: unverified claim', 'n/a': 'n/a: dataset or tool, not graded'}
  const TYPE_LABEL = {'dataset': 'Dataset', 'data-tool': 'Data tool', 'model': 'Brain model or engine', 'body': 'Fly body', 'demo-game': 'Game', 'demo-desktop': 'Desktop app', 'demo-art': 'Art', 'browser-demo': 'Browser demo', 'research': 'Research or control study', 'directory': 'Directory'}
  const PAGE = 15
  const gradeClass = g => 'g-' + (g === 'n/a' ? 'na' : String(g).toLowerCase())
  const list = v => Array.isArray(v) ? v.filter(Boolean).map(String) : (typeof v === 'string' && v.trim() ? v.split(/\s*[,/;]\s*/).filter(Boolean) : [])
  const httpsOnly = u => typeof u === 'string' && /^https:\/\//.test(u) ? u : null
  const datasetKey = d => String(d || 'unknown').split(' (')[0]

  const entries = (raw.entries || []).map(e => {
    const platforms = list(e.platform)
    const tryUrl = httpsOnly(e.try_url)
    return {
      id: String(e.id || ''), name: String(e.name || e.id || 'Untitled'), summary: String(e.summary || ''),
      author: String(e.author_or_org || ''), type: String(e.type || 'other'), grade: GRADES.includes(e.evidence_grade) ? e.evidence_grade : 'U',
      gradeNote: e.grade_note || '', datasetKey: datasetKey(e.dataset), dataset: [e.dataset, e.release].filter(v => v && !/^n\/a/.test(v)).join(' · ') || 'none',
      mech: String(e.mechanism_short || ''), licence: String(e.code_licence || 'not stated'), noLicence: Boolean(e.no_licence_file),
      platforms, browser: Boolean(tryUrl), gpu: String(e.gpu || 'not stated'), size: String(e.download_size || 'not stated'),
      commit: e.last_commit || '', release: e.last_release || null, updated: e.updated || '', verified: e.last_verified || '', link: String(e.link_status || 'not checked'),
      tryUrl, codeUrl: httpsOnly(e.code_url), sourceUrl: httpsOnly(e.source_url),
      text: [e.id, e.name, e.summary, e.author_or_org, e.type, TYPE_LABEL[e.type], e.dataset, e.release, ...(e.tags || [])].filter(Boolean).join(' ').toLowerCase(),
    }
  })

  const $ = id => document.getElementById(id)
  const els = {q: $('q'), type: $('f-type'), dataset: $('f-dataset'), licence: $('f-licence'), platform: $('f-platform'), browser: $('f-browser'), sort: $('f-sort'), results: $('results'), count: $('count'), empty: $('empty'), reset: $('reset'), more: $('more'), foot: $('foot')}

  const uniq = values => [...new Set(values)].sort((a, b) => a.localeCompare(b))
  const fill = (select, values, label = v => v) => {
    for (const value of values) { const o = document.createElement('option'); o.value = value; o.textContent = label(value); select.append(o) }
  }
  fill(els.type, uniq(entries.map(e => e.type)), v => TYPE_LABEL[v] || v)
  fill(els.dataset, uniq(entries.map(e => e.datasetKey)))
  fill(els.licence, uniq(entries.map(e => e.licence)))
  fill(els.platform, uniq(entries.flatMap(e => e.platforms)))

  const gradeGroup = document.querySelector('.grades')
  const pressed = new Set()
  let expanded = false
  const gradeButtons = GRADES.filter(g => entries.some(e => e.grade === g)).map(g => {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'gbtn ' + gradeClass(g); b.textContent = g
    b.setAttribute('aria-pressed', 'false'); b.title = GRADE_LABEL[g]
    b.setAttribute('aria-label', 'Grade ' + GRADE_LABEL[g])
    b.addEventListener('click', () => { pressed.has(g) ? pressed.delete(g) : pressed.add(g); b.setAttribute('aria-pressed', String(pressed.has(g))); render() })
    gradeGroup.append(b)
    return b
  })

  const gradeRank = g => GRADES.indexOf(g)
  const sorters = {
    'updated-desc': (a, b) => (b.updated || '').localeCompare(a.updated || '') || a.name.localeCompare(b.name),
    'updated-asc': (a, b) => (a.updated || '9999').localeCompare(b.updated || '9999') || a.name.localeCompare(b.name),
    'grade': (a, b) => gradeRank(a.grade) - gradeRank(b.grade) || a.name.localeCompare(b.name),
    'name': (a, b) => a.name.localeCompare(b.name),
  }

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n }
  const linkPill = s => el('span', 'pill ' + (/^ok/i.test(s) ? 'ok' : /^redirect/i.test(s) ? 'warn' : /4xx|5xx|error/i.test(s) ? 'bad' : ''), s)

  function row(e) {
    const li = el('li', 'row')
    const g = el('span', 'grade ' + gradeClass(e.grade), e.grade); g.title = GRADE_LABEL[e.grade]; g.setAttribute('aria-label', 'Evidence grade ' + GRADE_LABEL[e.grade])
    const body = el('div')
    const h = el('h3', '', e.name + ' ')
    h.append(el('code', 'rid', e.id))
    body.append(h)
    body.append(el('p', 'by', [e.author, TYPE_LABEL[e.type] || e.type].filter(Boolean).join(' · ')))
    if (e.summary) body.append(el('p', 'summary', e.summary))
    if (e.gradeNote) body.append(el('p', 'gnote', e.gradeNote))
    if (e.mech) body.append(el('p', 'mech', e.mech))
    const facts = el('ul', 'facts')
    const fact = (k, v) => { const li = el('li'); li.append(el('span', '', k + ': ')); if (v instanceof Node) li.append(v); else li.append(document.createTextNode(v)); facts.append(li) }
    fact('Dataset', e.dataset)
    fact('Code licence', e.noLicence ? el('strong', 'flag', 'No licence file') : e.licence)
    fact('Runs on', e.platforms.join(', ') || 'not stated')
    fact('GPU', e.gpu)
    if (e.size !== 'not stated') fact('Download', e.size)
    fact('Last commit', e.commit || 'n/a')
    if (e.release) fact('Last release', `${e.release.tag}${e.release.date ? ' (' + e.release.date + ')' : ''}`)
    fact('Checked by us', e.verified || 'not yet')
    fact('Link', linkPill(e.link))
    body.append(facts)
    const urls = el('ul', 'urls')
    const url = (label, u, note) => { const li = el('li'); li.append(el('span', 'ulabel', label)); li.append(el('span', 'url', u)); if (note) li.append(el('span', 'unote', note)); urls.append(li) }
    if (e.tryUrl) url('Try', e.tryUrl, 'page responds, not played by us')
    if (e.codeUrl) url('Code', e.codeUrl)
    if (e.sourceUrl && e.sourceUrl !== e.codeUrl && e.sourceUrl !== e.tryUrl) url('Source', e.sourceUrl)
    if (!urls.childNodes.length) urls.append(el('li', 'none', 'No public link'))
    body.append(urls)
    body.append(el('p', 'rowref', `Full evidence and clickable links: row ${e.id} in the table below this tool.`))
    li.append(g, body)
    return li
  }

  function render() {
    const q = els.q.value.trim().toLowerCase()
    const words = q ? q.split(/\s+/) : []
    const shown = entries.filter(e =>
      (!pressed.size || pressed.has(e.grade)) &&
      (!els.type.value || e.type === els.type.value) &&
      (!els.dataset.value || e.datasetKey === els.dataset.value) &&
      (!els.licence.value || e.licence === els.licence.value) &&
      (!els.platform.value || e.platforms.includes(els.platform.value)) &&
      (!els.browser.checked || e.browser) &&
      words.every(w => e.text.includes(w))
    ).sort(sorters[els.sort.value] || sorters['updated-desc'])
    const visible = expanded ? shown : shown.slice(0, PAGE)
    els.results.replaceChildren(...visible.map(row))
    els.count.replaceChildren(el('strong', '', String(shown.length)), document.createTextNode(` of ${entries.length} entries match`))
    els.empty.hidden = shown.length > 0
    els.more.hidden = shown.length <= PAGE
    els.more.textContent = expanded ? `Show only the first ${PAGE}` : `Show all ${shown.length} matching entries`
    els.more.setAttribute('aria-expanded', String(expanded))
  }

  els.reset.addEventListener('click', () => {
    els.q.value = ''; for (const s of [els.type, els.dataset, els.licence, els.platform]) s.value = ''
    els.browser.checked = false; els.sort.value = 'updated-desc'; pressed.clear(); expanded = false
    for (const b of gradeButtons) b.setAttribute('aria-pressed', 'false')
    render()
  })
  els.more.addEventListener('click', () => { expanded = !expanded; render() })
  els.q.addEventListener('input', render)
  for (const s of [els.type, els.dataset, els.licence, els.platform, els.browser, els.sort]) s.addEventListener('change', render)
  els.foot.textContent = raw.last_verification ? `All links checked by us on ${raw.last_verification}. "Page responds" means the page answered; we did not play the demo.` : ''
  render()
})()
</script>
<script src="../assets/shaduf-tool-resize.js"></script>
</body>
</html>
