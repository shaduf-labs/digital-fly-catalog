<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Search and filter fruit fly brain projects</title>
<style>
  :root {
    --ink: #37352f; --text: #4f4d47; --muted: #787774; --faint: #a8a6a1;
    --line: #e6e5e2; --line-strong: #d4d2cd; --soft: #f7f7f5; --blue: #326ca6; --blue-bg: #e7eef6;
    --green: #3e7d5c; --green-bg: #e7f1eb; --amber: #8a641f; --amber-bg: #f5edda; --red: #9f3f3b; --red-bg: #f8e7e5;
    --grade-a: #1d5a43; --grade-b: #3f8a66; --grade-c: #8fc0a4; --grade-d: #d3e6da;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { color: var(--ink); font: 14px/1.5 Inter, "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { padding: 16px 16px 18px; min-width: 0; }
  .search { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
  label, .group-label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  input[type=search], select {
    width: 100%; min-width: 0; min-height: 2.5em; padding: .4em .6em; border: 1px solid var(--line-strong); border-radius: 5px;
    background: #fff; color: var(--ink); font: inherit; font-size: 14px;
  }
  input[type=search]:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, input[type=checkbox]:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  .grades { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
  .grades .group-label { margin-right: 4px; }
  .gbtn {
    min-width: 2.6em; min-height: 2.2em; padding: 0 .6em; border: 1.5px solid var(--line-strong); border-radius: 5px;
    background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .gbtn[aria-pressed="true"].g-a { background: var(--grade-a); border-color: var(--grade-a); color: #fff; }
  .gbtn[aria-pressed="true"].g-b { background: var(--grade-b); border-color: var(--grade-b); color: #fff; }
  .gbtn[aria-pressed="true"].g-c { background: var(--grade-c); border-color: var(--grade-c); }
  .gbtn[aria-pressed="true"].g-d { background: var(--grade-d); border-color: #b9d2c3; }
  .gbtn[aria-pressed="true"].g-u { background: #fff; border-style: dashed; border-color: var(--ink); }
  .gbtn[aria-pressed="true"].g-na { background: var(--line); border-color: var(--muted); }
  .gbtn:hover { border-color: var(--ink); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 0 0 12px; }
  .filters > div { display: flex; flex-direction: column; gap: 4px; flex: 1 1 10em; min-width: 0; }
  .toggles { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 12px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13.5px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; }
  .check input { width: 1.1em; height: 1.1em; margin: 0; }
  .sort { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sort select { width: auto; max-width: 100%; }
  .status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin: 0 0 8px; }
  .count { margin: 0; color: var(--text); font-size: 13px; }
  .count strong { color: var(--ink); }
  .reset { padding: .35em .8em; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--soft); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  .reset:hover { border-color: var(--ink); }
  ol.results { margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
  .row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row > * { min-width: 0; }
  .grade { display: inline-flex; align-items: center; justify-content: center; width: 2.4em; height: 2.4em; border-radius: 5px; font-size: 13px; font-weight: 700; line-height: 1; }
  .grade.g-a { background: var(--grade-a); color: #fff; }
  .grade.g-b { background: var(--grade-b); color: #fff; }
  .grade.g-c { background: var(--grade-c); color: var(--ink); }
  .grade.g-d { background: var(--grade-d); color: var(--ink); }
  .grade.g-u { background: #fff; color: var(--text); border: 1.5px dashed var(--muted); }
  .grade.g-na { background: var(--line); color: var(--text); font-size: 11px; }
  .row h3 { margin: 0; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-weight: 500; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .by { margin: 2px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .summary { margin: 6px 0 0; color: var(--text); font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--text); }
  .facts li { min-width: 0; overflow-wrap: anywhere; }
  .facts span { color: var(--muted); }
  .pill { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .pill.warn { background: var(--amber-bg); color: var(--amber); }
  .pill.bad { background: var(--red-bg); color: var(--red); }
  .empty { padding: 18px 0; color: var(--text); }
  .empty[hidden] { display: none; }
  .foot { margin: 12px 0 0; color: var(--muted); font-size: 11.5px; }
  .rid { margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: var(--soft); color: var(--text); font: 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; user-select: all; }
  .gnote { margin: 6px 0 0; padding: 6px 9px; border-left: 3px solid var(--amber); background: var(--amber-bg); color: var(--ink); font-size: 12.5px; line-height: 1.5; }
  .mech { margin: 6px 0 0; color: var(--text); font-size: 12px; line-height: 1.5; }
  .flag { color: var(--red); font-weight: 700; }
  .urls { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .urls li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 2px 0; min-width: 0; }
  .ulabel { min-width: 3.6em; color: var(--muted); font-weight: 600; }
  .url { min-width: 0; color: var(--ink); font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; overflow-wrap: anywhere; user-select: all; }
  .unote { color: var(--muted); font-size: 11.5px; }
  .urls .none { color: var(--faint); }
  .rowref { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; }
  .more { display: block; width: 100%; margin: 12px 0 0; padding: .6em 1em; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--soft); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .more:hover { border-color: var(--ink); }
  .more[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
</style>
</head>
<body>
<div class="app" data-shaduf-resize-root>

  <div class="search">
    <label for="q">Search projects</label>
    <input id="q" type="search" placeholder="Name, ID, idea or author, e.g. Doom, walking, FlyGym" autocomplete="off">
  </div>

  <div class="grades" role="group" aria-labelledby="grade-label">
    <span class="group-label" id="grade-label">Evidence grade</span>
    <!-- grade buttons are built from the data -->
  </div>

  <div class="filters">
    <div><label for="f-type">Category</label><select id="f-type"><option value="">All categories</option></select></div>
    <div><label for="f-dataset">Dataset</label><select id="f-dataset"><option value="">All datasets</option></select></div>
    <div><label for="f-licence">Code licence</label><select id="f-licence"><option value="">All licences</option></select></div>
    <div><label for="f-platform">Runs on</label><select id="f-platform"><option value="">All platforms</option></select></div>
    <div><label for="f-controls">Controls</label><select id="f-controls"><option value="">Any or none</option><option value="wiring-null">Wiring null (scrambled wiring)</option><option value="baseline-only">No-brain baseline only</option><option value="none">No control</option></select></div>
  </div>

  <div class="toggles">
    <label class="check" for="f-browser"><input id="f-browser" type="checkbox"> Try in browser, no install</label>
    <span class="sort"><label for="f-sort">Sort</label>
      <select id="f-sort">
        <option value="updated-desc">Last upstream update, newest first</option>
        <option value="updated-asc">Last upstream update, oldest first</option>
        <option value="grade">Evidence grade, A first</option>
        <option value="name">Name, A to Z</option>
      </select>
    </span>
  </div>

  <div class="status">
    <p class="count" id="count" aria-live="polite"></p>
    <button type="button" class="reset" id="reset">Reset filters</button>
  </div>

  <ol class="results" id="results" aria-label="Matching projects"></ol>
  <button type="button" class="more" id="more" hidden>Show all</button>
  <p class="empty" id="empty" hidden>No projects match these filters. Try fewer filters or a shorter search.</p>
  <p class="foot" id="foot"></p>
</div>

rollers; version 2 also offers GPU batch simulation through MuJoCo Warp.","evidence_grade":"n/a","grade_note":null,"dataset":"none","release":"n/a","data_licence":"n/a","mechanism_short":"Model: none · In: none · Out: none · Trained: none · Scripted: n/a · Body: FlyGym","code_licence":"Apache-2.0","no_licence_file":false,"platform":["browser","Linux","macOS","Colab"],"gpu":"optional","download_size":"not stated (large meshes fetched lazily from S3)","last_commit":"2026-06-29","last_release":{"tag":"Version 2.1.0","date":"2026-06-24"},"updated":"2026-06-29","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":"https://neuromechfly.org/wasm/viewer/viewer.html","try_status":"page responds, not played by us","code_url":"https://github.com/NeLy-EPFL/flygym","source_url":"https://doi.org/10.1038/s41592-024-02497-y","browser_check":null,"controls":"none","wiring_effect":"not-tested","ledger":false,"tags":["Simulating embodied sensorimotor control with NeuroMechFly v2"]},{"id":"bioreservoir","name":"BioReservoir","type":"research","author_or_org":"IG Digital Lab (igdigitallab)","summary":"Runs the MaleCNS v1.0 connectome as a fixed spiking reservoir (Brian2 LIF, Shiu et al. port). Question text is embedded, projected at random onto sensory neurons, and the left/right bias of descending neurons is read as a yes/no answer. Runs are pre-registered and compared with rewired, random-graph, no-brain and coin controls.","evidence_grade":"B","grade_note":null,"dataset":"several","release":"MaleCNS v1.0 (used for all batch-001 runs); BANC materialization 626 (Dataverse doi:10.7910/DVN/8TFGGB), loaded but excluded from headline claims","data_licence":"several (see dataset entries)","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none · Scripted: none found · Body: none","code_licence":"Apache-2.0","no_licence_file":false,"platform":["browser","Linux"],"gpu":"none","download_size":"~1.1 GB MaleCNS v1.0 data (weights file 1.05 GB) plus BANC files (scripts/datasets.json)","last_commit":"2026-09-24","last_release":{"tag":"snapshot-e2d7e7e95b3e","date":"2026-09-24"},"updated":"2026-09-24","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":"https://fly.igdigi.com","try_status":"page responds, not played by us","code_url":"https://github.com/igdigitallab/bioreservoir","source_url":null,"browser_check":null,"controls":"wiring-null","wiring_effect":"not-tested","ledger":true,"tags":["Public connectomes as fixed reservoirs: load a real brain's wiring, simulate it as a spiking network, drive it, read it out — with controls and pre-registration.","control benchmark"]},{"id":"doom-fly-control","name":"Is the fly brain actually playing DOOM? (control experiments)","type":"research","author_or_org":"gabrycina (GitHub)","summary":"A third-party control study of two viral 'fly brain plays DOOM' projects. It re-runs the untrained 166,700-neuron DOOMFLY simulation with shuffled wiring, no connections, blind input and a brainless fixed autopilot, and re-trains the doomfly-rl network with real, rewired and absent wiring. It also re-runs a sugar/bitter taste test on the Shiu et al. whole-brain model with real versus shuffled wiring.","evidence_grade":"A","grade_note":null,"dataset":"MaleCNS (DOOM experiments); FlyWire FAFB (taste experiment via the Shiu model)","release":"MaleCNS v1.0 (SHA-256 matched, via nftechie/DOOMFLY); FlyWire v630 (Shiu model commit 91bdd1e)","data_licence":"FlyWire FAFB: CC-BY-NC-4.0; MaleCNS: CC-BY-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none · Scripted: yes · Body: none","code_licence":"MIT","no_licence_file":false,"platform":["macOS","Linux"],"gpu":"optional (author used Apple MPS; CPU and MPS results reported equal)","download_size":"repo about 16 MB including a 12 MB video; reproducing needs the upstream projects, MaleCNS v1.0 tables and doomfly-rl checkpoints from Hugging Face","last_commit":"2026-09-27","last_release":null,"updated":"2026-09-27","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/gabrycina/doom-fly-control","source_url":"https://github.com/nftechie/DOOMFLY","browser_check":null,"controls":"wiring-null","wiring_effect":"helps","ledger":true,"tags":["The fly brain isn't what's playing DOOM: a constant turn-right, walk, shoot autopilot survives as long as the untrained spiking fly (52 s vs 53 s), and trained agents score the same with real, random or no wiring.","control benchmark"]},{"id":"doomfly-rl","name":"doomfly-rl","type":"research","author_or_org":"Fabio Nonato (nonatofabio)","summary":"A Doom-playing network in the style of chessfly: a learned conv encoder feeds visual sensory neurons of a real fly connectome (FlyWire v783 or a 49k-neuron MaleCNS subgraph), the graph is unrolled for 5 rate steps, and a learned decoder reads central and descending neurons to pick actions. The student is distilled from per-scenario PPO teachers and then fine-tuned with GRPO. The repo includes degree-preserving shuffle and no-connectome controls trained with the same recipe, and reports that the wiring gives no measurable advantage.","evidence_grade":"A","grade_note":null,"dataset":"FlyWire (FAFB) and MaleCNS","release":"FlyWire v783 (Shiu et al. Connectivity_783.parquet, SHA-256 checked) and a 49,393-neuron MaleCNS subgraph from Hugging Face dataset fernandofernandes/fly-connectome-49k","data_licence":"CC-BY-4.0","mechanism_short":"Model: rate · In: learned · Out: learned · Trained: yes · Scripted: none found · Body: none","code_licence":"MIT","no_licence_file":false,"platform":["Linux","macOS"],"gpu":"optional for evaluation (CPU command given); training used one NVIDIA L40S per run","download_size":"not checked (Hugging Face checkpoints plus a MaleCNS-49k connectome file; FlyWire build needs the Shiu et al. parquet)","last_commit":"2026-09-27","last_release":null,"updated":"2026-09-27","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/nonatofabio/doomfly-rl","source_url":"https://nonatofabio.github.io/blog/posts/doomfly_autonomous.html","browser_check":null,"controls":"wiring-null","wiring_effect":"no-difference","ledger":true,"tags":["A neural network wired like a fruit fly's brain, trained with gradient descent to play Doom; the connectome is treated as an inductive bias and the encoder, decoder and one gain per synapse are learned.","control benchmark"]},{"id":"embodied-fly-brain-erojas","name":"Emergent Individuality in Whole-Brain Connectome Simulations of Drosophila (fly-brain)","type":"research","author_or_org":"Enrique Manuel Rojas Aliaga (erojasoficial-byte)","summary":"The full FlyWire v783 graph runs as a PyTorch LIF network (the Shiu et al. model) with Hebbian plasticity, coupled to a NeuroMechFly v2 (flygym/MuJoCo) body. About 18 named descending neurons are read out and mapped by hand onto left/right drive for flygym's CPG turning controller. Grooming, flight and feeding are scripted motor programs that start when readout rates cross thresholds, and several sensory paths skip the brain altogether.","evidence_grade":"C","grade_note":"Borderline C: the neural part alone could argue for B, but the behaviour shown is triggered, scripted motion. The file citations behind this grade were spot-read by us, not re-verified line by line.","dataset":"FlyWire FAFB","release":"v783 (2025_Connectivity_783.parquet, 138,639 neurons)","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: LIF · In: Hand-made · Out: Hand-made · Trained: none · Scripted: yes · Body: NeuroMechFly v2","code_licence":"MIT","no_licence_file":false,"platform":["Linux","Windows"],"gpu":"CUDA GPU recommended (PyTorch); falls back to CPU, which is much slower","download_size":"About 270 MB with Git LFS (README); connectivity parquet ~101 MB, annotations TSV ~33 MB","last_commit":"2026-03-21","last_release":null,"updated":"2026-03-21","last_ ed recurrent network built from the full MaleCNS wiring. The adapter nudges the model's next-word scores. The project compares this against a matched adapter that gets no graph input.","evidence_grade":"A","grade_note":null,"dataset":"MaleCNS","release":"v1.0 (minconf 0.5 flat-connectome feather, SHA-256 pinned)","data_licence":"CC-BY-4.0","mechanism_short":"Model: rate · In: hand-made · Out: learned · Trained: yes · Scripted: none found · Body: none","code_licence":"MIT","no_licence_file":false,"platform":["macOS","Linux"],"gpu":"optional","download_size":"several GB (LLM weights, corpus, MaleCNS arrays); at least 10 GB free disk","last_commit":"2026-09-11","last_release":null,"updated":"2026-09-11","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/nftechie/flm","source_url":"https://artificialscientific.com/papers/flies-are-all-you-need","browser_check":null,"controls":"baseline-only","wiring_effect":"not-tested","ledger":true,"tags":["A frozen language model with a trained readout of the MaleCNS v1.0 fly connectome: 166,700 retained nodes and 25,582,938 directed connections.","control benchmark"]},{"id":"fly-api","name":"fly-api","type":"research","author_or_org":"dtch1997","summary":"Glue code around existing tools. It runs the Shiu et al. whole-brain LIF model (FlyWire v630) to show sugar input driving the MN9 feeding motor neuron. It also runs FlyGym walking and visual-taxis examples that do not use the connectome. A navigation demo uses an 8,991-neuron olfactory/mushroom-body LIF subnetwork with depressed KC-to-MBON synapses: its MBON output sets a hand-made turning command for the FlyGym body.","evidence_grade":"C","grade_note":"The file citations behind this C grade were spot-read by us, not re-verified line by line.","dataset":"FlyWire FAFB","release":"v630 (Shiu model data for taste demo); v783 annotations/completeness for the learning and navigation subnet","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none · Scripted: yes · Body: FlyGym","code_licence":"MIT","no_licence_file":false,"platform":["Linux"],"gpu":"none","download_size":"repo about 10 MB; needs a clone of philshiu/Drosophila_brain_model and FlyGym/MuJoCo","last_commit":"2026-09-08","last_release":null,"updated":"2026-09-08","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/dtch1997/fly-api","source_url":null,"browser_check":null,"controls":"none","wiring_effect":"not-tested","ledger":false,"tags":["Sugar input drives the 'eat' motor neuron (0 to 92 Hz, dose-dependent), bitter vetoes it; the conditioned brain steers the body to the rewarded odor.","control benchmark"]},{"id":"fly-brain-zero-shot","name":"Are fruit flies zero-shot adapters?","type":"research","author_or_org":"Vibhakar Mohta (vib2810)","summary":"A closed loop in which the FlyVis eye model sees a dark pole, 27 of its output cell types drive about 31,000 matching FlyWire neurons, the Shiu et al. whole-brain spiking model runs on the GPU with unchanged weights, and the left-right difference of the DNa02 turn neurons sets the turning of a NeuroMechFly body whose legs are moved by a hand-built tripod rhythm. Two legs are removed mid-walk from cloned flies. The same flies are rerun with scrambled wiring and with the turn neurons disconnected, and poles reached per 10 s are compared.","evidence_grade":"A","grade_note":"Borderline A: walking comes from a hand-built rhythm generator and the brain only steers through one tuned gain; the scrambled comparison after the leg cut has 16 flies from a single shuffle, and only the per-fly summary table is stored.","dataset":"FlyWire FAFB","release":"v783 (Shiu et al. Connectivity_783.parquet, pinned commit, checksummed); whole brain, 138,639 neurons","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: spiking · In: FlyVis · Out: hand-set · Trained: none · Scripted: yes · Body: NeuroMechFly","code_licence":"MIT","no_licence_file":false,"platform":["Linux"],"gpu":"NVIDIA GPU","download_size":"about 100 MB Shiu connectivity plus FlyWire annotations and FlyVis weights via the download script","last_commit":"2026-09-29","last_release":null,"updated":"2026-09-29","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/vib2810/fly-brain-zero-shot","source_url":null,"browser_check":null,"controls":"wiring-null","wiring_effect":"helps","ledger":true,"tags":["A spiking model of the whole fruit fly brain steers a simulated body toward dark poles; after two legs are cut mid-walk it keeps finding the poles; scramble its wiring and it can't.","control benchmark"]},{"id":"fly-cartpole","name":"fly-cartpole","type":"research","author_or_org":"Curt Park","summary":"A flight-stabilisation circuit cut from MaleCNS v1.0 (5,459 neurons: ocellar, haltere and HS sensory groups down to the wing-amplitude motor neurons, run as linear rate units) balances Gymnasium's CartPole. The circuit's couplings never change; only three to five sensor gains are tuned by reward-modulated random search. The author compares it with degree-preserving shuffled wiring, the untuned circuit, the circuit's own linear map tuned the same way, LQR and random pushes on fresh seeds, with permutation tests. An earlier mushroom-body version (dopamine-gated learning) is still in the repository with its own negative result. A browser viewer simulates the circuit live.","evidence_grade":"A","grade_note":null,"dataset":"MaleCNS","release":"v1.0; flight-stabilisation circuit, 5,459 neurons (data/flight*); the earlier mushroom-body circuits (343 PNs, 1,893 KCs, 48 MBONs, 332 DANs) remain in the repository","data_licence":"CC-BY-4.0","mechanism_short":"Model: rate · In: hand-set · Out: hand-set · Trained: yes · Scripted: yes · Body: none","code_licence":"MIT","no_licence_file":false,"platform":["browser","Linux","macOS","Windows"],"gpu":"none","download_size":"processed mushroom-body data committed (data/*.npz); the full extract downloads 1.1 GB once","last_commit":"2026-10-03","last_release":null,"updated":"2026-10-03","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/Curt-Park/fly-cartpole","source_url":null,"browser_check":null,"controls":"wiring-null","wiring_effect":"helps","ledger":true,"tags":["The circuit a fly uses to keep its balance in the air balances the pole: wired from MaleCNS v1.0, 5,459 neurons, no backpropagation; learning only changes five sensor gains.","control benchmark"]},{"id":"fly-connectome-adds-to-body","name":"FLY-lab: What a fly connectome adds to controlling a body","type":"research","author_or_org":"Recluse (FLY-lab contributors)","summary":"Couples the Shiu et al. FlyWire v783 LIF brain model to the NeuroMechFly body in FlyGym and tests five action selectors on simple turn-toward-touch tasks: constant command, a two-line rule, the live connectome, a replay of another episode's brain output, and five degree-preserving shuffled connectomes.","evidence_grade":"A","grade_note":null,"dataset":"FlyWire FAFB","release":"v783 (138,639 neurons, 15,091,983 connections; v630 for the sugar reference check)","data_licence":"CC-BY-NC-4.0","mechanism_short":"Model: LIF · In: hand-made · Out: hand-made · Trained: none · Scripted: yes · Body: FlyGym","code_licence":"MIT","no_licence_file":false,"platform":["macOS","Linux"],"gpu":"none","download_size":"not stated (Shiu model repo with v783 tables; two Python environments)","last_commit":"2026-09-18","last_release":null,"updated":"2026-09-18","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/Recluse/FLY-lab","source_url":"https://github.com/Recluse/FLY-lab/blob/main/paper/fly-lab-en.pdf","browser_check":null,"controls":"wiring-null","wiring_effect":"helps","led puted outside the brain; a linear softmax decoder over about 90 descending-neuron spike counts, cloned from human hand histories, chooses the action.","evidence_grade":"C","grade_note":null,"dataset":"MaleCNS","release":"v1.0 (neuPrint male-cns:v1.0), 6,194-neuron subgraph, min 8 synapses (data/circuit_meta.json, data/circuit.npz)","data_licence":"MaleCNS v1.0 derived data committed (CC BY 4.0 per Janelia; not stated in the repository)","mechanism_short":"Model: spiking · In: hand-made · Out: learned · Trained: yes · Scripted: yes · Body: none","code_licence":"No licence file","no_licence_file":true,"platform":["Linux","macOS","Windows"],"gpu":"none","download_size":"repository about 3 MB of data (circuit.npz 1.6 MB uncompressed arrays, brain.stl mesh)","last_commit":"2026-10-01","last_release":null,"updated":"2026-10-01","last_verified":"2026-10-03","link_status":"ok (HTTP 200)","try_url":null,"try_status":null,"code_url":"https://github.com/0909-BoB/flypoker","source_url":null,"browser_check":null,"controls":"none","wiring_effect":"not-tested","ledger":false,"tags":["\"A subgraph of a real fly brain (MaleCNS v1.0 connectome, Janelia/Google, 2026) plays no-limit Texas Hold'em, via a spiking neural network simulation with a small trainable readout layer on top.\" (README)","control benchmark"]},{"id":"fruitfly-roblox","name":"Fruit fly vs Jev: Roblox maze race","type":"demo-game","author_or_org":"SolidifiedPlayDoh","summary":"A Roblox maze race between a character driven by a spiking MaleCNS brain model and one driven by a hosted language model. Roblox sends raycast distances, object lists and an apple 'smell' to a local Python server. Spike rates of a few descending-neuron types are turned into forward and turn commands by hand-set formulas, then blended with a scripted steering routine that picks open space toward the apple and remembers visited cells. The scripted part carries most of the weight in the maze.","evidence_grade":"C","grade_note":null,"dataset":"Male <script>
(() => {
  const raw = JSON.parse(document.getElementById('catalogue-data').textContent)
  const GRADES = ['A', 'B', 'C', 'D', 'U', 'n/a']
  const GRADE_LABEL = {A: 'A: tested against data or a control', B: 'B: connectome runs, hand-made inputs and outputs', C: 'C: partial, stand-in or decorative network', D: 'D: scripted or game logic', U: 'U: unverified claim', 'n/a': 'n/a: dataset or tool, not graded'}
  const TYPE_LABEL = {'dataset': 'Dataset', 'data-tool': 'Data tool', 'model': 'Brain model or engine', 'body': 'Fly body', 'demo-game': 'Game', 'demo-desktop': 'Desktop app', 'demo-art': 'Art', 'browser-demo': 'Browser demo', 'research': 'Research or control study', 'directory': 'Directory'}
  const PAGE = 15
  const gradeClass = g => 'g-' + (g === 'n/a' ? 'na' : String(g).toLowerCase())
  const list = v => Array.isArray(v) ? v.filter(Boolean).map(String) : (typeof v === 'string' && v.trim() ? v.split(/\s*[,/;]\s*/).filter(Boolean) : [])
  const httpsOnly = u => typeof u === 'string' && /^https:\/\//.test(u) ? u : null
  const datasetKey = d => String(d || 'unknown').split(' (')[0]

  const entries = (raw.entries || []).map(e => {
    const platforms = list(e.platform)
    const tryUrl = httpsOnly(e.try_url)
    return {
      id: String(e.id || ''), name: String(e.name || e.id || 'Untitled'), summary: String(e.summary || ''),
      author: String(e.author_or_org || ''), type: String(e.type || 'other'), grade: GRADES.includes(e.evidence_grade) ? e.evidence_grade : 'U',
      gradeNote: e.grade_note || '', datasetKey: datasetKey(e.dataset), dataset: [e.dataset, e.release].filter(v => v && !/^n\/a/.test(v)).join(' · ') || 'none',
      mech: String(e.mechanism_short || ''), licence: String(e.code_licence || 'not stated'), noLicence: Boolean(e.no_licence_file),
      platforms, browser: Boolean(tryUrl), gpu: String(e.gpu || 'not stated'), size: String(e.download_size || 'not stated'),
      commit: e.last_commit || '', release: e.last_release || null, updated: e.updated || '', verified: e.last_verified || '', link: String(e.link_status || 'not checked'),
      tryUrl, codeUrl: httpsOnly(e.code_url), sourceUrl: httpsOnly(e.source_url),
      controls: e.controls || '', effect: e.wiring_effect || '', ledger: Boolean(e.ledger), tryStatus: String(e.try_status || 'page responds, not played by us'), bc: e.browser_check && typeof e.browser_check === 'object' ? e.browser_check : null,
      text: [e.id, e.name, e.summary, e.author_or_org, e.type, TYPE_LABEL[e.type], e.dataset, e.release, ...(e.tags || [])].filter(Boolean).join(' ').toLowerCase(),
    }
  })

  const $ = id => document.getElementById(id)
  const CONTROLS_LABEL = {'wiring-null': 'wiring null', 'baseline-only': 'no-brain baseline only', 'none': 'none'}
  const EFFECT_LABEL = {helps: 'real wiring helps', 'no-difference': 'no difference', worse: 'real wiring does worse', mixed: 'mixed', 'not-tested': 'not tested'}
  const els = {controls: $('f-controls'), q: $('q'), type: $('f-type'), dataset: $('f-dataset'), licence: $('f-licence'), platform: $('f-platform'), browser: $('f-browser'), sort: $('f-sort'), results: $('results'), count: $('count'), empty: $('empty'), reset: $('reset'), more: $('more'), foot: $('foot')}

  const uniq = values => [...new Set(values)].sort((a, b) => a.localeCompare(b))
  const fill = (select, values, label = v => v) => {
    for (const value of values) { const o = document.createElement('option'); o.value = value; o.textContent = label(value); select.append(o) }
  }
  fill(els.type, uniq(entries.map(e => e.type)), v => TYPE_LABEL[v] || v)
  fill(els.dataset, uniq(entries.map(e => e.datasetKey)))
  fill(els.licence, uniq(entries.map(e => e.licence)))
  fill(els.platform, uniq(entries.flatMap(e => e.platforms)))

  const gradeGroup = document.querySelector('.grades')
  const pressed = new Set()
  let expanded = false
  const gradeButtons = GRADES.filter(g => entries.some(e => e.grade === g)).map(g => {
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'gbtn ' + gradeClass(g); b.textContent = g
    b.setAttribute('aria-pressed', 'false'); b.title = GRADE_LABEL[g]
    b.setAttribute('aria-label', 'Grade ' + GRADE_LABEL[g])
    b.addEventListener('click', () => { pressed.has(g) ? pressed.delete(g) : pressed.add(g); b.setAttribute('aria-pressed', String(pressed.has(g))); render() })
    gradeGroup.append(b)
    return b
  })

  const gradeRank = g => GRADES.indexOf(g)
  const sorters = {
    'updated-desc': (a, b) => (b.updated || '').localeCompare(a.updated || '') || a.name.localeCompare(b.name),
    'updated-asc': (a, b) => (a.updated || '9999').localeCompare(b.updated || '9999') || a.name.localeCompare(b.name),
    'grade': (a, b) => gradeRank(a.grade) - gradeRank(b.grade) || a.name.localeCompare(b.name),
    'name': (a, b) => a.name.localeCompare(b.name),
  }

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n }
  const linkPill = s => el('span', 'pill ' + (/^ok/i.test(s) ? 'ok' : /^redirect/i.test(s) ? 'warn' : /4xx|5xx|error|gone/i.test(s) ? 'bad' : ''), s)

  function row(e) {
    const li = el('li', 'row')
    const g = el('span', 'grade ' + gradeClass(e.grade), e.grade); g.title = GRADE_LABEL[e.grade]; g.setAttribute('aria-label', 'Evidence grade ' + GRADE_LABEL[e.grade])
    const body = el('div')
    const h = el('h3', '', e.name + ' ')
    h.append(el('code', 'rid', e.id))
    body.append(h)
    body.append(el('p', 'by', [e.author, TYPE_LABEL[e.type] || e.type].filter(Boolean).join(' · ')))
    if (e.summary) body.append(el('p', 'summary', e.summary))
    if (e.gradeNote) body.append(el('p', 'gnote', e.gradeNote))
    if (e.mech) body.append(el('p', 'mech', e.mech))
    const facts = el('ul', 'facts')
    const fact = (k, v) => { const li = el('li'); li.append(el('span', '', k + ': ')); if (v instanceof Node) li.append(v); else li.append(document.createTextNode(v)); facts.append(li) }
    fact('Dataset', e.dataset)
    fact('Code licence', e.noLicence ? el('strong', 'flag', 'No licence file') : e.licence)
    fact('Runs on', e.platforms.join(', ') || 'not stated')
    fact('GPU', e.gpu)
    if (e.size !== 'not stated') fact('Download', e.size)
    fact('Last commit', e.commit || 'n/a')
    if (e.release) fact('Last release', `${e.release.tag}${e.release.date ? ' (' + e.release.date + ')' : ''}`)
    if (e.controls) fact('Controls', CONTROLS_LABEL[e.controls] || e.controls)
    if (e.controls === 'wiring-null') fact('Wiring effect', el('span', 'pill ' + (e.effect === 'helps' ? 'ok' : e.effect === 'worse' ? 'bad' : e.effect === 'mixed' ? 'warn' : ''), EFFECT_LABEL[e.effect] || 'not tested'))
    if (e.bc) fact('Browser check', el('span', 'pill ' + (e.bc.status === 'runs' ? 'ok' : 'warn'), `${e.bc.label} (${e.bc.checked_at}; ${e.bc.mb} MB; brain: ${e.bc.compute})`))
    fact('Checked by us', e.verified || 'not yet')
    fact('Link', linkPill(e.link))
    body.append(facts)
    const urls = el('ul', 'urls')
    const url = (label, u, note) => { const li = el('li'); li.append(el('span', 'ulabel', label)); li.append(el('span', 'url', u)); if (note) li.append(el('span', 'unote', note)); urls.append(li) }
    if (e.tryUrl) url('Try', e.tryUrl, e.tryStatus)
    if (e.codeUrl) url('Code', e.codeUrl)
    if (e.sourceUrl && e.sourceUrl !== e.codeUrl && e.sourceUrl !== e.tryUrl) url('Source', e.sourceUrl)
    if (!urls.childNodes.length) urls.append(el('li', 'none', 'No public link'))
    body.append(urls)
    body.append(el('p', 'rowref', `Full evidence and clickable links: row ${e.id} in the table below this tool.${e.ledger ? ' Its control study is also in the study table on the page "Does fly wiring help?".' : ''}`))
    li.append(g, body)
    return li
  }

  function render() {
    const q = els.q.value.trim().toLowerCase()
    const words = q ? q.split(/\s+/) : []
    const shown = entries.filter(e =>
      (!pressed.size || pressed.has(e.grade)) &&
      (!els.type.value || e.type === els.type.value) &&
      (!els.dataset.value || e.datasetKey === els.dataset.value) &&
      (!els.licence.value || e.licence === els.licence.value) &&
      (!els.platform.value || e.platforms.includes(els.platform.value)) &&
      (!els.controls.value || e.controls === els.controls.value) &&
      (!els.browser.checked || e.browser) &&
      words.every(w => e.text.includes(w))
    ).sort(sorters[els.sort.value] || sorters['updated-desc'])
    const visible = expanded ? shown : shown.slice(0, PAGE)
    els.results.replaceChildren(...visible.map(row))
    els.count.replaceChildren(el('strong', '', String(shown.length)), document.createTextNode(` of ${entries.length} entries match`))
    els.empty.hidden = shown.length > 0
    els.more.hidden = shown.length <= PAGE
    els.more.textContent = expanded ? `Show only the first ${PAGE}` : `Show all ${shown.length} matching entries`
    els.more.setAttribute('aria-expanded', String(expanded))
  }

  els.reset.addEventListener('click', () => {
    els.q.value = ''; for (const s of [els.type, els.dataset, els.licence, els.platform, els.controls]) s.value = ''
    els.browser.checked = false; els.sort.value = 'updated-desc'; pressed.clear(); expanded = false
    for (const b of gradeButtons) b.setAttribute('aria-pressed', 'false')
    render()
  })
  els.more.addEventListener('click', () => { expanded = !expanded; render() })
  els.q.addEventListener('input', render)
  for (const s of [els.type, els.dataset, els.licence, els.platform, els.controls, els.browser, els.sort]) s.addEventListener('change', render)
  els.foot.textContent = raw.last_verification ? `All links checked by us on ${raw.last_verification}. "Page responds" means the page answered; we did not play the demo.` : ''
  render()
})()
</script>
<script src="../assets/shaduf-tool-resize.js"></script>
</body>
</html>
