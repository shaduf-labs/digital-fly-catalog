<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Filter and sort the fly wiring control studies</title>
<style>
  :root {
    --ink: #37352f; --text: #4f4d47; --muted: #787774; --faint: #a8a6a1;
    --line: #e6e5e2; --line-strong: #d4d2cd; --soft: #f7f7f5; --blue: #326ca6; --blue-bg: #e7eef6;
    --helps: #2a8560; --nodiff: #8a8984; --worse: #c2503a; --mixed: #5a6cc0;
    --grade-a: #1d5a43; --grade-b: #3f8a66; --grade-c: #8fc0a4; --grade-d: #d3e6da;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { color: var(--ink); font: 14px/1.5 Inter, "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { padding: 16px 16px 18px; min-width: 0; }
  label, .group-label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  input[type=search], select {
    width: 100%; min-width: 0; min-height: 2.5em; padding: .4em .6em; border: 1px solid var(--line-strong); border-radius: 5px;
    background: #fff; color: var(--ink); font: inherit; font-size: 14px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .search { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
  .effects { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
  .effects .group-label { margin-right: 4px; }
  .fbtn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 2.2em; padding: 0 .7em; border: 1.5px solid var(--line-strong); border-radius: 5px;
    background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .fbtn:hover { border-color: var(--ink); }
  .fbtn[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); box-shadow: inset 0 -3px 0 var(--ink); }
  .sw { display: inline-block; width: .8em; height: .8em; border-radius: 50%; flex: none; }
  .sw.helps, .dot.helps { background: var(--helps); }
  .sw.no-difference, .dot.no-difference { background: var(--nodiff); }
  .sw.worse, .dot.worse { background: var(--worse); }
  .sw.mixed, .dot.mixed { background: var(--mixed); }
  .sw.not-scored, .sw.no-null, .dot.not-scored, .dot.no-null { background: #fff; border: 1.5px dashed var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 0 0 12px; }
  .filters > div { display: flex; flex-direction: column; gap: 4px; flex: 1 1 10em; min-width: 0; }
  .status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin: 0 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .count { margin: 0; color: var(--text); font-size: 13px; }
  .count strong { color: var(--ink); }
  .reset { padding: .35em .8em; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--soft); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  .reset:hover { border-color: var(--ink); }
  ol.results { margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
  .row { padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .row h3 { margin: 0; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-weight: 500; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .rid { margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: var(--soft); color: var(--text); font: 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; }
  .by { margin: 2px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12px; font-weight: 600; }
  .grade { display: inline-flex; align-items: center; justify-content: center; min-width: 1.8em; padding: 0 4px; border-radius: 4px; font-size: 12px; font-weight: 700; }
  .grade.g-a { background: var(--grade-a); color: #fff; } .grade.g-b { background: var(--grade-b); color: #fff; }
  .grade.g-c { background: var(--grade-c); } .grade.g-d { background: var(--grade-d); }
  .grade.g-u { background: #fff; border: 1.5px dashed var(--muted); } .grade.g-na { background: var(--line); }
  .result { margin: 8px 0 0; color: var(--ink); font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
  .meter { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin: 8px 0 0; max-width: 34em; }
  .track { position: relative; height: 18px; border-bottom: 1px solid var(--line-strong); }
  .track .ref { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--faint); }
  .track .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; }
  .track .dia { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; transform: rotate(45deg); background: #fff; border: 2px solid var(--ink); }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--text); }
  .facts li { min-width: 0; overflow-wrap: anywhere; }
  .facts span { color: var(--muted); }
  .why { margin: 6px 0 0; color: var(--text); font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .why b { color: var(--ink); font-weight: 600; }
  .urls { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .urls li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 2px 0; min-width: 0; }
  .ulabel { min-width: 4.5em; color: var(--muted); font-weight: 600; }
  .url { min-width: 0; color: var(--ink); font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; overflow-wrap: anywhere; user-select: all; }
  .rowref { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; }
  .more { display: block; width: 100%; margin: 12px 0 0; padding: .6em 1em; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--soft); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .more:hover { border-color: var(--ink); }
  .more[hidden], .empty[hidden] { display: none; }
  .empty { padding: 18px 0; color: var(--text); }
  .foot { margin: 12px 0 0; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<div class="app" data-shaduf-resize-root>

  <div class="search">
    <label for="q">Search studies</label>
    <input id="q" type="search" placeholder="Name or idea, e.g. Doom, CartPole, reflex, reservoir" autocomplete="off">
  </div>

  <div class="effects" role="group" aria-labelledby="effect-label">
    <span class="group-label" id="effect-label">Wiring effect</span>
    <!-- effect buttons are built from the data -->
  </div>

  <div class="filters">
    <div><label for="f-family">Task family</label><select id="f-family"><option value="">All task families</option></select></div>
    <div><label for="f-quality">Method quality</label><select id="f-quality"><option value="">Any quality</option><option value="strong">Strong</option><option value="moderate">Moderate</option><option value="weak">Weak</option></select></div>
    <div><label for="f-fair">Null fairness</label><select id="f-fair"><option value="">Any fairness</option><option value="fair">Fair</option><option value="partly-fair">Partly fair</option><option value="unclear">Unclear</option><option value="unfair">Unfair</option></select></div>
    <div><label for="f-sort">Sort</label><select id="f-sort">
      <option value="family">Task family</option>
      <option value="ret-asc">Retention, lowest first (wiring matters most)</option>
      <option value="ret-desc">Retention, highest first</option>
      <option value="quality">Method quality, strong first</option>
      <option value="name">Name, A to Z</option>
    </select></div>
  </div>

  <div class="status">
    <p class="count" id="count" aria-live="polite"></p>
    <button type="button" class="reset" id="reset">Reset filters</button>
  </div>

  <ol class="results" id="results" aria-label="Matching studies"></ol>
  <button type="button" class="more" id="more" hidden>Show all</button>
  <p class="empty" id="empty" hidden>No studies match these filters. Try fewer filters or a shorter search.</p>
  <p class="foot" id="foot"></p>
</div>

  const $ = id => document.getElementById(id)
  const els = {q: $('q'), family: $('f-family'), quality: $('f-quality'), fair: $('f-fair'), sort: $('f-sort'), results: $('results'), count: $('count'), empty: $('empty'), reset: $('reset'), more: $('more'), foot: $('foot')}
  for (const f of families) { if (!studies.some(s => s.family === f.id)) continue; const o = document.createElement('option'); o.value = f.id; o.textContent = f.label; els.family.append(o) }
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n }
  const pressed = new Set()
  let expanded = false
  const group = document.querySelector('.effects')
  const buttons = EFFECTS.filter(e => studies.some(s => s.effect === e)).map(e => {
    const b = el('button', 'fbtn'); b.type = 'button'
    b.append(el('span', 'sw ' + e), document.createTextNode(`${EFFECT_LABEL[e]} (${studies.filter(s => s.effect === e).length})`))
    b.setAttribute('aria-pressed', 'false')
    b.addEventListener('click', () => { pressed.has(e) ? pressed.delete(e) : pressed.add(e); b.setAttribute('aria-pressed', String(pressed.has(e))); render() })
    group.append(b)
    return b
  })
  const retKey = s => s.retention === null ? null : s.retention
  const sorters = {
    family: (a, b) => a.order - b.order,
    'ret-asc': (a, b) => (retKey(a) ?? 99) - (retKey(b) ?? 99) || a.order - b.order,
    'ret-desc': (a, b) => (retKey(b) ?? -1) - (retKey(a) ?? -1) || a.order - b.order,
    quality: (a, b) => QUALITY.indexOf(a.quality) - QUALITY.indexOf(b.quality) || a.order - b.order,
    name: (a, b) => a.name.localeCompare(b.name),
  }
  const pct = v => `${(Math.min(v, MAXR) / MAXR * 100).toFixed(1)}%`
  function meter(s) {
    if (s.retention === null && s.baseline === null) return null
    const box = el('div', 'meter')
    const track = el('div', 'track')
    track.setAttribute('role', 'img')
    const parts = []
    if (s.retention !== null) parts.push(`scrambled wiring keeps ${s.retention.toFixed(2)} of the real result`)
    if (s.baseline !== null) parts.push(`a no-brain baseline reaches ${s.baseline.toFixed(2)}`)
    track.setAttribute('aria-label', parts.join('; '))
    for (const v of [0, 1]) { const r = el('span', 'ref'); r.style.left = pct(v); track.append(r) }
    if (s.retention !== null) { const d = el('span', 'dot ' + s.effect); d.style.left = pct(s.retention); track.append(d) }
    if (s.baseline !== null) { const d = el('span', 'dia'); d.style.left = pct(s.baseline); track.append(d) }
    const scale = el('div', 'scale')
    scale.append(el('span', '', '0: no better than no network'), el('span', '', '1: as good as real'))
    box.append(track, scale)
    return box
  }
  function row(s) {
    const li = el('li', 'row')
    const h = el('h3', '', s.name + ' '); h.append(el('code', 'rid', s.id)); li.append(h)
    li.append(el('p', 'by', [FAMILY_LABEL[s.family], s.loop, s.made_by_us ? 'our own run' : null].filter(Boolean).join(' · ')))
    const badges = el('div', 'badges')
    const fx = el('span', 'badge'); fx.append(el('span', 'sw ' + s.effect), document.createTextNode(EFFECT_LABEL[s.effect])); badges.append(fx)
    const g = el('span', 'badge'); const gc = el('span', 'grade g-' + (s.grade === 'n/a' ? 'na' : String(s.grade).toLowerCase()), s.grade); g.append(gc, document.createTextNode('catalogue grade')); badges.append(g)
    badges.append(el('span', 'badge', `${s.quality} method`), el('span', 'badge', `${FAIR_LABEL[s.fairness] || s.fairness} null`))
    li.append(badges)
    li.append(el('p', 'result', s.result))
    const m = meter(s); if (m) li.append(m)
    const facts = el('ul', 'facts')
    const fact = (k, v) => { const f = el('li'); f.append(el('span', '', k + ': '), document.createTextNode(v)); facts.append(f) }
    fact('Retention', s.retention === null ? 'none' : s.retention.toFixed(2))
    if (s.baseline !== null) fact('No-brain baseline', s.baseline.toFixed(2))
    if (s.headline_null) fact('Headline null', s.headline_null)
    fact('Numbers from', s.from)
    fact('Checked', s.checked_at)
    li.append(facts)
    const why = el('p', 'why'); why.append(el('b', '', 'Fairness: '), document.createTextNode(s.fairness_reason + ' '), el('b', '', 'Quality: '), document.createTextNode(s.quality_reason)); li.append(why)
    const urls = el('ul', 'urls')
    const url = (label, u) => { const x = el('li'); x.append(el('span', 'ulabel', label), el('span', 'url', u)); urls.append(x) }
    if (s.source_url) url('Source', s.source_url)
    if (s.catalogue_url) url('Catalogue', s.catalogue_url)
    if (urls.childNodes.length) li.append(urls)
    li.append(el('p', 'rowref', `Clickable links: row ${s.id} in the study table below this tool.`))
    return li
  }
  function render() {
    const words = els.q.value.trim().toLowerCase().split(/\s+/).filter(Boolean)
    const shown = studies.filter(s =>
      (!pressed.size || pressed.has(s.effect)) &&
      (!els.family.value || s.family === els.family.value) &&
      (!els.quality.value || s.quality === els.quality.value) &&
      (!els.fair.value || s.fairness === els.fair.value) &&
      words.every(w => s.text.includes(w))
    ).sort(sorters[els.sort.value] || sorters.family)
    const visible = expanded ? shown : shown.slice(0, PAGE)
    els.results.replaceChildren(...visible.map(row))
    els.count.replaceChildren(el('strong', '', String(shown.length)), document.createTextNode(` of ${studies.length} studies match`))
    els.empty.hidden = shown.length > 0
    els.more.hidden = shown.length <= PAGE
    els.more.textContent = expanded ? `Show only the first ${PAGE}` : `Show all ${shown.length} matching studies`
    els.more.setAttribute('aria-expanded', String(expanded))
  }
  els.reset.addEventListener('click', () => {
    els.q.value = ''; for (const s of [els.family, els.quality, els.fair]) s.value = ''
    els.sort.value = 'family'; pressed.clear(); expanded = false
    for (const b of buttons) b.setAttribute('aria-pressed', 'false')
    render()
  })
  els.more.addEventListener('click', () => { expanded = !expanded; render() })
  els.q.addEventListener('input', render)
  for (const s of [els.family, els.quality, els.fair, els.sort]) s.addEventListener('change', render)
  els.foot.textContent = raw.version ? `Controls ledger version ${raw.version}, as of ${raw.as_of}. Numbers are the authors' unless a study says "our own run"; labels follow fixed rules and are coarse.` : ''
  render()
})()
</script>
<script src="../assets/shaduf-tool-resize.js"></script>
</body>
</html>
